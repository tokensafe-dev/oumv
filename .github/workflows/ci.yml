name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Lint (typecheck)
        run: pnpm lint

      - name: Lint adapter manifests
        run: |
          for manifest in adapters/*.json; do
            node packages/conformance/dist/cli/lint-adapter.js "$manifest"
          done

      - name: Check adapter capabilities against fixtures
        run: node scripts/check_adapter_capabilities.mjs

      - name: Check generated artifacts (errors registry, compatibility matrix)
        run: |
          node scripts/gen-errors.mjs --check
          node scripts/gen-compat.mjs --check

      - name: Run test suite
        run: pnpm test
